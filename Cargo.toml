[package]
name = "herdr-relay"
version = "0.2.3"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hackerchai/herdr-relay"
homepage = "https://herdr-relay.hackerchai.com"
readme = "README.md"
keywords = ["terminal", "relay", "herdr", "cloudflare"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/docs/**", "/protocol/**", "/relay/src/**", "/relay/test/**", "/relay/scripts/**", "/relay/README.md", "/relay/package.json", "/relay/package-lock.json", "/relay/tsconfig.json", "/relay/wrangler.jsonc", "/relay/eslint.config.js", "/relay/.prettierrc.json", "/relay/.prettierignore", "/patches/**", "/scripts/build-herdr.sh"]
description = "An authenticated relay for native Herdr clients"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hostname = "0.4"
httpdate = "1.0"
if-addrs = "0.15"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm", "crossterm_0_29"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tar = "0.4"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
x509-parser = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
