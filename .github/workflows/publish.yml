name: Publish
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Validate tag syntax
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate release, ancestry and synchronized versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          python3 - <<'PY'
          import json, os, tomllib
          version = os.environ['TAG'][1:]
          assert tomllib.load(open('Cargo.toml', 'rb'))['package']['version'] == version
          assert json.load(open('relay/package.json'))['version'] == version
          assert json.load(open('.release-please-manifest.json'))['.'] == version
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  binaries:
    needs: [validate, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.16.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl compiler
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_key=${TARGET//-/_}
          echo "CARGO_TARGET_${target_key^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CC_${target_key}=musl-gcc" >> "$GITHUB_ENV"
      - name: Package CLI and bounded native server
        env:
          TARGET: ${{ matrix.target }}
        run: |
          scripts/package.sh "$TARGET"
          scripts/build-herdr.sh package "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/packages/*.tar.gz
            target/packages/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, checks, binaries]
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: binaries-*
          path: target/packages
          merge-multiple: true
      - name: Verify artifacts and publish private GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          (cd target/packages && sha256sum -c ./*.sha256)
          python3 scripts/package-source.py
          gh release upload "$TAG" target/packages/*.tar.gz target/packages/*.sha256 --clobber
      - name: Publish CLI to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish-crate.py
      - run: npm ci
        working-directory: relay
      - name: Deploy the matching Worker
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 ../scripts/check-cloudflare-plan.py
          npm run deploy:production
      - name: Check production protocol endpoint
        run: python3 scripts/check-relay.py https://herdr-relay.hackerchai.com
